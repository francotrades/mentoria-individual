<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Definir senha | FrancoTrades</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at top,
          rgba(22,199,132,.10),
          transparent 35%
        ),
        #080b0f;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }

    .wrapper {
      width: 100%;
      max-width: 430px;
    }

    .logo {

      text-align: center;

      margin-bottom: 30px;

      font-size: 27px;
      font-weight: 800;

      letter-spacing: 1px;

    }

    .logo span {
      color: #16c784;
    }

    .card {

      background: #10141b;

      border: 1px solid #202833;

      border-radius: 16px;

      padding: 32px;

    }

    h1 {

      text-align: center;

      font-size: 24px;

      margin-bottom: 8px;

    }

    .description {

      text-align: center;

      color: #89939f;

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 26px;

    }

    label {

      display: block;

      margin-bottom: 7px;

      font-size: 12px;

      color: #c1cad4;

      font-weight: 700;

    }

    .field {
      margin-bottom: 17px;
    }

    input {

      width: 100%;

      padding: 13px 14px;

      border-radius: 9px;

      border: 1px solid #2a3440;

      background: #0b1016;

      color: white;

      outline: none;

      font-size: 14px;

    }

    input:focus {
      border-color: #16c784;
    }

    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #16c784;

      color: #04130d;

      font-weight: 800;

      cursor: pointer;

    }

    button:disabled {
      opacity: .50;
      cursor: not-allowed;
    }

    .message {

      display: none;

      margin-top: 17px;

      padding: 12px;

      border-radius: 9px;

      font-size: 13px;

      text-align: center;

      line-height: 1.5;

    }

    .message.error {

      display: block;

      background: rgba(239,68,68,.10);

      border: 1px solid rgba(239,68,68,.3);

      color: #fca5a5;

    }

    .message.success {

      display: block;

      background: rgba(22,199,132,.10);

      border: 1px solid rgba(22,199,132,.3);

      color: #6ee7b7;

    }

    .loading {

      color: #89939f;

      text-align: center;

      font-size: 13px;

      margin-bottom: 18px;

    }

    .hidden {
      display: none;
    }

  </style>

</head>

<body>

<div class="wrapper">

  <div class="logo">
    FRANCO<span>TRADES</span>
  </div>


  <div class="card">

    <h1>
      Crie sua senha
    </h1>

    <p class="description">
      Defina a senha que você usará para
      acessar sua Mentoria Individual.
    </p>


    <div
      id="loading"
      class="loading"
    >
      Validando seu convite...
    </div>


    <form
      id="passwordForm"
      class="hidden"
    >

      <div class="field">

        <label for="password">
          Nova senha
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirmar nova senha
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >

      </div>


      <button
        id="submitButton"
        type="submit"
      >
        DEFINIR MINHA SENHA
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   IMPORTANTE:
   Antes do Supabase processar a URL, verificamos
   se esta página realmente veio de um convite.
   ===================================================== */

const originalHash =
  window.location.hash;


const originalSearch =
  window.location.search;


const hashParams =
  new URLSearchParams(
    originalHash.startsWith("#")
      ? originalHash.substring(1)
      : originalHash
  );


const searchParams =
  new URLSearchParams(
    originalSearch
  );


const authType =
  hashParams.get("type") ||
  searchParams.get("type");


const isInviteLink =
  authType === "invite";


const supabase =
  createClient(

    "https://vfnltuecpnuixemxvwvk.supabase.co",

    "sb_publishable_nxgAFL2foBN8CuKMT5_2qQ_uDlaJ4Xc"

  );


const form =
  document.getElementById(
    "passwordForm"
  );


const loading =
  document.getElementById(
    "loading"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const confirmInput =
  document.getElementById(
    "confirmPassword"
  );


const button =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    `message ${type}`;

}


function showForm() {

  loading.classList.add(
    "hidden"
  );

  form.classList.remove(
    "hidden"
  );

}


function blockPage(
  text
) {

  loading.classList.add(
    "hidden"
  );

  form.classList.add(
    "hidden"
  );

  showMessage(
    text,
    "error"
  );

}


/* =====================================================
   VALIDAÇÃO DO CONVITE
   ===================================================== */

async function initialize() {

  /*
   * Se alguém simplesmente digitar:
   *
   * /definir-senha/
   *
   * a página NÃO permitirá alteração da senha.
   */

  if (!isInviteLink) {

    blockPage(
      "Esta página só pode ser utilizada através do link de convite enviado pela FrancoTrades."
    );

    return;

  }


  /*
   * O Supabase detecta automaticamente os tokens
   * recebidos na URL do convite.
   */

  let attempts = 0;


  while (
    attempts < 20
  ) {

    const {
      data: {
        session
      }
    } =
      await supabase.auth
        .getSession();


    if (session) {

      showForm();

      return;

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          150
        )
    );


    attempts++;

  }


  blockPage(
    "Este convite é inválido ou expirou. Solicite um novo convite para acessar a mentoria."
  );

}


/* =====================================================
   DEFINIR SENHA
   ===================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const password =
      passwordInput.value;


    const confirmation =
      confirmInput.value;


    if (
      password.length < 8
    ) {

      showMessage(
        "A senha precisa ter pelo menos 8 caracteres.",
        "error"
      );

      return;

    }


    if (
      password !==
      confirmation
    ) {

      showMessage(
        "As duas senhas não são iguais.",
        "error"
      );

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "SALVANDO...";


    /*
     * Confere a sessão uma última vez.
     */

    const {
      data: {
        session
      }
    } =
      await supabase.auth
        .getSession();


    if (!session) {

      blockPage(
        "Sua sessão de convite expirou. Solicite um novo convite."
      );

      return;

    }


    const {
      error
    } =
      await supabase.auth
        .updateUser({
          password
        });


    if (error) {

      console.error(
        error
      );


      showMessage(
        "Não foi possível definir sua senha. Solicite um novo convite.",
        "error"
      );


      button.disabled =
        false;


      button.textContent =
        "DEFINIR MINHA SENHA";


      return;

    }


    showMessage(
      "Senha criada com sucesso. Redirecionando para sua área...",
      "success"
    );


    setTimeout(
      () => {

        window.location.href =
          "../aluno/";

      },
      1200
    );

  }
);


initialize();

</script>

</body>
</html>
