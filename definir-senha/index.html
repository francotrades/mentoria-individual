<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Definir senha | FrancoTrades</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at top,
          rgba(22,199,132,.10),
          transparent 35%
        ),
        #080b0f;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }

    .wrapper {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #16c784;
    }

    .card {
      background: #10141b;
      border: 1px solid #202833;
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #89939f;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      color: #c1cad4;
      font-weight: 700;
    }

    .field {
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #2a3440;
      background: #0b1016;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #16c784;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16c784;
      color: #04130d;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .50;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: rgba(22,199,132,.10);
      border: 1px solid rgba(22,199,132,.3);
      color: #6ee7b7;
    }

    .loading {
      color: #89939f;
      text-align: center;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .hidden {
      display: none;
    }

  </style>

</head>

<body>

<div class="wrapper">

  <div class="logo">
    FRANCO<span>TRADES</span>
  </div>


  <div class="card">

    <h1 id="pageTitle">
      Defina sua senha
    </h1>

    <p
      id="pageDescription"
      class="description"
    >
      Crie uma senha segura para acessar sua Mentoria Individual.
    </p>


    <div
      id="loading"
      class="loading"
    >
      Validando seu link...
    </div>


    <form
      id="passwordForm"
      class="hidden"
    >

      <div class="field">

        <label for="password">
          Nova senha
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirmar nova senha
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >

      </div>


      <button
        id="submitButton"
        type="submit"
      >
        SALVAR NOVA SENHA
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://vfnltuecpnuixemxvwvk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_nxgAFL2foBN8CuKMT5_2qQ_uDlaJ4Xc";


const originalHash =
  window.location.hash;


const originalSearch =
  window.location.search;


const hashParams =
  new URLSearchParams(
    originalHash.startsWith("#")
      ? originalHash.substring(1)
      : originalHash
  );


const searchParams =
  new URLSearchParams(
    originalSearch
  );


const authType =
  hashParams.get("type") ||
  searchParams.get("type");


const allowedTypes =
  new Set([
    "invite",
    "recovery"
  ]);


const isAllowedFlow =
  allowedTypes.has(
    authType
  );


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById(
    "passwordForm"
  );


const loading =
  document.getElementById(
    "loading"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const confirmInput =
  document.getElementById(
    "confirmPassword"
  );


const button =
  document.getElementById(
    "submitButton"
  );


const message =
  document.getElementById(
    "message"
  );


const pageTitle =
  document.getElementById(
    "pageTitle"
  );


const pageDescription =
  document.getElementById(
    "pageDescription"
  );


function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    `message ${type}`;

}


function showForm() {

  loading.classList.add(
    "hidden"
  );

  form.classList.remove(
    "hidden"
  );

}


function blockPage(
  text
) {

  loading.classList.add(
    "hidden"
  );

  form.classList.add(
    "hidden"
  );

  showMessage(
    text,
    "error"
  );

}


function dateExpired(
  expirationDate
) {

  if (!expirationDate) {
    return false;
  }


  const expiration =
    new Date(
      expirationDate +
      "T23:59:59"
    );


  return expiration <
    new Date();

}


/* AJUSTA O TEXTO DE ACORDO COM O FLUXO */

if (
  authType === "invite"
) {

  pageTitle.textContent =
    "Crie sua senha";


  pageDescription.textContent =
    "Defina a senha que você usará para acessar sua Mentoria Individual.";

}

else if (
  authType === "recovery"
) {

  pageTitle.textContent =
    "Redefina sua senha";


  pageDescription.textContent =
    "Crie uma nova senha para recuperar o acesso à sua conta.";

}


/* VALIDAÇÃO */

async function initialize() {

  if (!isAllowedFlow) {

    blockPage(
      "Esta página só pode ser utilizada através de um link válido de convite ou recuperação de senha."
    );

    return;

  }


  let attempts = 0;


  while (
    attempts < 25
  ) {

    const {
      data: {
        session
      }
    } =
      await supabase.auth
        .getSession();


    if (session) {

      showForm();

      return;

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          150
        )
    );


    attempts++;

  }


  blockPage(
    "Este link é inválido ou expirou. Solicite um novo convite ou uma nova recuperação de senha."
  );

}


/* SALVAR SENHA */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const password =
      passwordInput.value;


    const confirmation =
      confirmInput.value;


    if (
      password.length < 8
    ) {

      showMessage(
        "A senha precisa ter pelo menos 8 caracteres.",
        "error"
      );

      return;

    }


    if (
      password !==
      confirmation
    ) {

      showMessage(
        "As duas senhas não são iguais.",
        "error"
      );

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "SALVANDO...";


    const {
      data: {
        session
      }
    } =
      await supabase.auth
        .getSession();


    if (!session) {

      blockPage(
        "Sua sessão expirou. Solicite um novo link."
      );

      return;

    }


    const {
      error
    } =
      await supabase.auth
        .updateUser({
          password
        });


    if (error) {

      console.error(
        error
      );


      showMessage(
        "Não foi possível salvar sua nova senha. Solicite um novo link.",
        "error"
      );


      button.disabled =
        false;


      button.textContent =
        "SALVAR NOVA SENHA";


      return;

    }


    showMessage(
      authType === "invite"
        ?
        "Senha criada com sucesso. Redirecionando para sua área..."
        :
        "Senha redefinida com sucesso. Redirecionando...",
      "success"
    );


    setTimeout(
      async () => {

        const {
          data: {
            user
          }
        } =
          await supabase.auth
            .getUser();


        if (!user) {

          window.location.href =
            "../login/";

          return;

        }


        const {
          data: profile,
          error: profileError
        } =
          await supabase

            .from(
              "profiles"
            )

            .select(
              "role, status, data_expiracao"
            )

            .eq(
              "id",
              user.id
            )

            .single();


        if (
          profileError ||
          !profile
        ) {

          await supabase.auth
            .signOut();


          window.location.href =
            "../login/?reason=profile";

          return;

        }


        if (
          profile.role ===
          "admin"
        ) {

          window.location.href =
            "../admin/";

          return;

        }


        if (
          profile.status ===
          "inativo"
        ) {

          await supabase.auth
            .signOut();


          window.location.href =
            "../login/?reason=inactive";

          return;

        }


        if (
          profile.status ===
            "expirado" ||
          dateExpired(
            profile.data_expiracao
          )
        ) {

          await supabase.auth
            .signOut();


          window.location.href =
            "../login/?reason=expired";

          return;

        }


        if (
          profile.role ===
          "aluno"
        ) {

          window.location.href =
            "../aluno/";

          return;

        }


        await supabase.auth
          .signOut();


        window.location.href =
          "../login/?reason=profile";

      },
      1100
    );

  }
);


initialize();

</script>

</body>
</html>
