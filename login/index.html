<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | FrancoTrades</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at top,
          rgba(67,226,144, 0.08),
          transparent 35%
        ),
        #080b0f;

    }

    .wrapper {
      width: 100%;
      max-width: 410px;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {

      font-size: 28px;
      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: 8px;

    }

    .logo span {
      color: #43e290;
    }

    .subtitle {

      color: #89939f;

      font-size: 14px;

    }

    .card {

      background: #10141b;

      border: 1px solid #202833;

      border-radius: 16px;

      padding: 32px;

    }

    h1 {

      text-align: center;

      font-size: 25px;

      margin-bottom: 8px;

    }

    .description {

      text-align: center;

      color: #89939f;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 27px;

    }

    .field {
      margin-bottom: 17px;
    }

    label {

      display: block;

      margin-bottom: 7px;

      color: #c1cad4;

      font-size: 12px;
      font-weight: 700;

    }

    .password-wrapper {
      position: relative;
    }

    input {

      width: 100%;

      padding: 13px 14px;

      background: #0b1016;

      border: 1px solid #2a3440;
      border-radius: 9px;

      color: white;

      outline: none;

      font-size: 14px;

    }

    input:focus {
      border-color: #43e290;
    }

    .password-wrapper input {
      padding-right: 72px;
    }

    .show-password {

      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #89939f;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

    }

    .login-button {

      width: 100%;

      border: none;
      border-radius: 9px;

      background: #43e290;

      color: #04130d;

      padding: 14px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 8px;

    }

    .login-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .secure {

      margin-top: 23px;

      text-align: center;

      color: #68737f;

      font-size: 11px;

    }

    .message {

      display: none;

      margin-bottom: 19px;

      padding: 12px 13px;

      border-radius: 9px;

      font-size: 13px;
      line-height: 1.5;

      text-align: center;

    }

    .message.error {

      display: block;

      border: 1px solid rgba(239, 68, 68, .35);

      background: rgba(239, 68, 68, .08);

      color: #fca5a5;

    }

    .message.info {

      display: block;

      border: 1px solid rgba(67,226,144, .30);

      background: rgba(67,226,144, .07);

      color: #6ee7b7;

    }

    .forgot {

      display: block;

      margin-top: 15px;

      text-align: center;

      color: #89939f;

      font-size: 12px;

      text-decoration: none;

    }

    .forgot:hover {
      color: #43e290;
    }

  </style>

</head>

<body>

<div class="wrapper">

  <div class="brand">

    <div class="logo">
      FRANCO<span>TRADES</span>
    </div>

    <div class="subtitle">
      Mentoria Individual
    </div>

  </div>


  <div class="card">

    <h1>
      Área do Aluno
    </h1>

    <p class="description">
      Entre com o e-mail e a senha cadastrados
      para acessar sua mentoria.
    </p>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">

      <div class="field">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="seu@email.com"
        >

      </div>


      <div class="field">

        <label for="password">
          Senha
        </label>

        <div class="password-wrapper">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >

          <button
            id="showPassword"
            class="show-password"
            type="button"
          >
            Mostrar
          </button>

        </div>

      </div>


      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        ENTRAR
      </button>

    </form>


    <a
      href="#"
      id="forgotPassword"
      class="forgot"
    >
      Esqueci minha senha
    </a>


    <div class="secure">
      🔒 Acesso exclusivo para mentorados
    </div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://vfnltuecpnuixemxvwvk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_nxgAFL2foBN8CuKMT5_2qQ_uDlaJ4Xc";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );


const message =
  document.getElementById(
    "message"
  );


const showPassword =
  document.getElementById(
    "showPassword"
  );


const forgotPassword =
  document.getElementById(
    "forgotPassword"
  );


function showMessage(
  text,
  type = "error"
) {

  message.textContent =
    text;


  message.className =
    `message ${type}`;

}


function hideMessage() {

  message.textContent =
    "";


  message.className =
    "message";

}


function showAccessReason() {

  const reason =
    new URLSearchParams(
      window.location.search
    ).get(
      "reason"
    );


  const messages = {
    inactive:
      "Seu acesso à mentoria está temporariamente inativo.",
    expired:
      "O período de acesso à sua mentoria expirou. Entre em contato com a FrancoTrades.",
    profile:
      "Não foi possível localizar seu cadastro. Entre em contato com a FrancoTrades."
  };


  if (
    reason &&
    messages[reason]
  ) {

    showMessage(
      messages[reason],
      "error"
    );

  }

}


function dateExpired(
  expirationDate
) {

  if (!expirationDate) {
    return false;
  }


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  const expiration =
    new Date(
      expirationDate +
      "T23:59:59"
    );


  return (
    expiration <
    today
  );

}


/* =========================================
   DECIDE PARA ONDE O USUÁRIO DEVE IR
========================================= */

async function redirectUser(
  user
) {

  const {
    data: profile,
    error
  } =
    await supabase

      .from(
        "profiles"
      )

      .select(`
        role,
        status,
        data_expiracao
      `)

      .eq(
        "id",
        user.id
      )

      .single();


  if (
    error ||
    !profile
  ) {

    console.error(
      "Erro carregando profile:",
      error
    );


    await supabase.auth
      .signOut();


    showMessage(
      "Não foi possível localizar seu cadastro. Entre em contato com a FrancoTrades."
    );


    loginButton.disabled =
      false;


    loginButton.textContent =
      "ENTRAR";


    return;

  }


  /* ADMIN */

  if (
    profile.role ===
    "admin"
  ) {

    window.location.href =
      "../admin/";


    return;

  }


  /* ALUNO INATIVO */

  if (
    profile.status ===
    "inativo"
  ) {

    await supabase.auth
      .signOut();


    showMessage(
      "Seu acesso à mentoria está temporariamente inativo."
    );


    loginButton.disabled =
      false;


    loginButton.textContent =
      "ENTRAR";


    return;

  }


  /* ALUNO EXPIRADO */

  if (
    profile.status ===
      "expirado" ||
    dateExpired(
      profile.data_expiracao
    )
  ) {

    await supabase.auth
      .signOut();


    showMessage(
      "O período de acesso à sua mentoria expirou. Entre em contato com a FrancoTrades."
    );


    loginButton.disabled =
      false;


    loginButton.textContent =
      "ENTRAR";


    return;

  }


  /* ALUNO ATIVO */

  if (
    profile.role ===
    "aluno"
  ) {

    window.location.href =
      "../aluno/";


    return;

  }


  /* SEGURANÇA */

  await supabase.auth
    .signOut();


  showMessage(
    "Seu usuário não possui um tipo de acesso válido."
  );


  loginButton.disabled =
    false;


  loginButton.textContent =
    "ENTRAR";

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",

  async event => {

    event.preventDefault();


    hideMessage();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    if (
      !email ||
      !password
    ) {

      showMessage(
        "Preencha o e-mail e a senha."
      );


      return;

    }


    loginButton.disabled =
      true;


    loginButton.textContent =
      "ENTRANDO...";


    const {
      data,
      error
    } =
      await supabase.auth
        .signInWithPassword({

          email,

          password

        });


    if (error) {

      console.error(
        error
      );


      loginButton.disabled =
        false;


      loginButton.textContent =
        "ENTRAR";


      if (
        error.message
          ?.toLowerCase()
          .includes(
            "invalid login credentials"
          )
      ) {

        showMessage(
          "E-mail ou senha incorretos."
        );

      }

      else {

        showMessage(
          "Não foi possível realizar o login. Tente novamente."
        );

      }


      return;

    }


    if (
      !data?.user
    ) {

      loginButton.disabled =
        false;


      loginButton.textContent =
        "ENTRAR";


      showMessage(
        "Não foi possível identificar o usuário."
      );


      return;

    }


    await redirectUser(
      data.user
    );

  }
);


/* =========================================
   MOSTRAR / ESCONDER SENHA
========================================= */

showPassword.addEventListener(
  "click",
  () => {

    const showing =
      passwordInput.type ===
      "text";


    passwordInput.type =
      showing
        ?
        "password"
        :
        "text";


    showPassword.textContent =
      showing
        ?
        "Mostrar"
        :
        "Ocultar";

  }
);


/* =========================================
   RECUPERAÇÃO DE SENHA
========================================= */

forgotPassword.addEventListener(
  "click",

  async event => {

    event.preventDefault();


    hideMessage();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    if (!email) {

      showMessage(
        "Digite primeiro seu e-mail no campo acima."
      );


      return;

    }


    const {
      error
    } =
      await supabase.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://francotrades.github.io/mentoria-individual/definir-senha/"
          }
        );


    if (error) {

      console.error(
        error
      );


      showMessage(
        "Não foi possível enviar o e-mail de recuperação."
      );


      return;

    }


    showMessage(
      "Enviamos um link de recuperação de senha para seu e-mail.",
      "info"
    );

  }
);


/* =========================================
   USUÁRIO JÁ ESTÁ LOGADO?
========================================= */

async function checkExistingSession() {

  const {
    data: {
      session
    }
  } =
    await supabase.auth
      .getSession();


  if (
    session?.user
  ) {

    loginButton.disabled =
      true;


    loginButton.textContent =
      "REDIRECIONANDO...";


    await redirectUser(
      session.user
    );

  }

}


showAccessReason();
checkExistingSession();

</script>

</body>
</html>
